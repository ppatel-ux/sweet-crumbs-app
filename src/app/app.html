@if (isNavigating()) {
  <div class="route-loading-bar" role="status" aria-label="Loading page">
    <span></span>
  </div>
}
<nav class="main-navigation" aria-label="Main navigation">
  <a routerLink="/team" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
    >Team</a
  >
  <a routerLink="/orders" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
    >Orders</a
  >
  @if (auth.currentUser()) {
    <a routerLink="/orders/new" routerLinkActive="active">New order</a>
  }
  @if (auth.currentUser()?.role === 'owner') {
    <a routerLink="/reports" routerLinkActive="active">Reports</a>
  }
  <a routerLink="/enquiry" routerLinkActive="active">Enquiry</a>
  @if (auth.currentUser(); as user) {
    <span class="current-user">Logged in: {{ user.role }}</span>
    <button type="button" class="navigation-button" (click)="logout()">Logout</button>
  } @else {
    <a routerLink="/login" routerLinkActive="active">Login</a>
  }
</nav>
<router-outlet />
