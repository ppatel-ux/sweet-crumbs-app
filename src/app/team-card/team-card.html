<app-card-shell class="team-card-shell" (click)="selectCard()">
  <div class="team-card__header" card-header>
    <div class="team-card__title-wrap">
      <span class="name">{{ member.name }}</span>
      @switch (member.job) {
        @case ('Founder and Sales Head') {
          <span class="job-badge founder">Founder</span>
        }
        @case ('Sales Rep') {
          <span class="job-badge sales">Sales</span>
        }
        @case ('Customer Support') {
          <span class="job-badge support">Support</span>
        }
        @default {
          <span class="job-badge team">Team</span>
        }
      }
    </div>
  </div>

  <div class="team-card__body" card-body>
    <ng-template #detailRow let-label="label" let-value="value">
      <div class="detail-row">
        <span class="detail-label">{{ label }}</span>
        <span class="detail-value">{{ value }}</span>
      </div>
    </ng-template>

    <ng-container
      [ngTemplateOutlet]="detailRow"
      [ngTemplateOutletContext]="{ label: 'Job', value: member.job }"
    ></ng-container>
    <ng-container
      [ngTemplateOutlet]="detailRow"
      [ngTemplateOutletContext]="{ label: 'Covers', value: member.covers }"
    ></ng-container>
    <ng-container
      [ngTemplateOutlet]="detailRow"
      [ngTemplateOutletContext]="{
        label: 'Joined',
        value: (member.joinedOn | date: dateFormat),
      }"
    ></ng-container>
    <ng-container
      [ngTemplateOutlet]="detailRow"
      [ngTemplateOutletContext]="{
        label: 'Monthly bonus',
        value: (member.monthlyBonus | currency: 'INR'),
      }"
    ></ng-container>
    <ng-container
      [ngTemplateOutlet]="detailRow"
      [ngTemplateOutletContext]="{
        label: 'Target achieved',
        value: (member.targetAchieved | percent: '1.0-0'),
      }"
    ></ng-container>
    <div class="detail-row bio-row">
      <span class="detail-label">Bio</span>
      <span class="detail-value">{{ member.bio | truncate }}</span>
    </div>
  </div>

  <div class="team-card__footer" card-footer>
    <span class="click-count">Clicks: {{ clickCount }}</span>
    <button type="button" class="copy-button" (click)="copySummary($event)">Copy summary</button>
    @if (copyMessage()) {
      <span class="copy-message" role="status">{{ copyMessage() }}</span>
    }
    <button type="button" class="favorite-button" (click)="onFavoriteClick($event)">
      {{ isFavorite ? 'Favorited' : 'Mark as favorite' }}
    </button>
  </div>
</app-card-shell>
