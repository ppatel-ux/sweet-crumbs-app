<main class="page-shell">
  <section class="form-section" aria-labelledby="login-heading">
    <h1 id="login-heading">Practice login</h1>
    <p>Choose a role to continue. No password is required.</p>
    <div class="toolbar">
      <button type="button" class="action-button" (click)="loginAs('staff')">
        Log in as Staff
      </button>
      <button type="button" class="action-button" (click)="loginAs('owner')">
        Log in as Owner
      </button>
    </div>
  </section>
</main>
