<main class="page-shell">
  <h1>Order {{ order().orderNumber }}</h1>
  <section class="orders-section" aria-label="Order details">
    <dl class="order-details">
      <dt>Customer</dt>
      <dd>{{ order().accountName }}</dd>
    </dl>
  </section>
  <nav class="order-tabs" aria-label="Order detail tabs">
    <a
      [routerLink]="['bake']"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >Bake</a>
    <a
      [routerLink]="['delivery']"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >Delivery</a>
  </nav>
  <router-outlet />
  <nav class="order-detail-navigation" aria-label="Order navigation">
    <a routerLink="/orders">Back to Orders</a>
    @if (nextOrderNumber) {
      <a [routerLink]="['/orders', nextOrderNumber]">Next order</a>
    }
  </nav>
</main>
